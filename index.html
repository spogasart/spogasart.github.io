<!DOCTYPE html>
<html>
<head>
	<title>Transitions</title>

   

   <style>


   	body{
   		font-family: sans-serif;
   		font-size:60px;
   		color:#FFF;
   	}

   	.cardholder{
        text-align: center;

   	}
      
    .card{
       position: relative;
       display: inline-block;
	   transition: filter 1.5s ease, transform 1.5s ease;
	   
    }

    .card img{
      width:600px;
      height:600px;
	  -webkit-filter: sepia(1);
	  filter: sepia(1);
    }


    .center {

     padding: 60% 0;
     text-align: center;
    }


    .card_overlay{
    	position:absolute;
    	background-color: lavender;
    	width:100%;
    	height:98%;
		transition: opacity 1.5s ease;
    	

    }


    .card:hover img{
      -webkit-filter: sepia(0);
	  filter: sepia(0);
      transition: transform 1.5s ease-out;
	  transform: scale(2);


    }
    .card:hover .card_overlay{
     opacity: .5;


    }

    .card_text{
    	margin:0;
    }



   </style>

</head>
<body>




	<div class="cardholder">
       <div class="card">
       	  <div class="card_overlay"></div>
       	  <img src="img.jpg" alt="my image">
       </div>
	</div>

</body>
</html>
